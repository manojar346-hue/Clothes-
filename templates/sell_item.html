<!DOCTYPE html>
<html>
<head><title>Sell Item</title></head>
<body>
<h2>Sell Item</h2>

<form method="POST">
    Name: <input name="name"><br><br>
    Size: 
    <select name="size">
        <option>S</option><option>M</option><option>L</option><option>XL</option>
    </select><br><br>
    Color: <input name="color"><br><br>
    Quantity: <input name="quantity" type="number"><br><br>

    <button type="submit">Sell</button>
</form>

</body>
</html>
