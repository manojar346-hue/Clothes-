{% extends "base.html" %}
{% block content %}

<h2 style="text-align:center;">Inventory</h2>

<table>
<tr>
<th>Name</th>
<th>Size</th>
<th>Color</th>
<th>Qty</th>
<th>Price</th>
</tr>

{% for i in data %}
<tr>
<td>{{ i[1] }}</td>
<td>{{ i[2] }}</td>
<td>{{ i[3] }}</td>
<td>{{ i[4] }}</td>
<td>₹{{ i[5] }}</td>
</tr>
{% endfor %}

</table>

{% endblock %}
