<!DOCTYPE html>
<html>
<head><title>Stock</title></head>
<body>
<h2>Current Stock</h2>

<table border="1">
<tr>
    <th>Name</th><th>Size</th><th>Color</th><th>Stock</th><th>Price</th>
</tr>

{% for i in items %}
<tr>
    <td>{{ i[1] }}</td>
    <td>{{ i[2] }}</td>
    <td>{{ i[3] }}</td>
    <td>{{ i[4] }}</td>
    <td>{{ i[5] }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
