{% extends "base.html" %}
{% block content %}
<h3 style="text-align:center;">Sales Analytics</h3>

<table>
    <tr>
        <th>Item</th>
        <th>Total Qty</th>
        <th>Total Revenue</th>
    </tr>

    {% for row in summary %}
    <tr>
        <td>{{ row[0] }}</td>
        <td>{{ row[1] }}</td>
        <td>₹{{ row[2] }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
