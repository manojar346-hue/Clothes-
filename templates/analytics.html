{% extends "base.html" %}
{% block content %}

<h2>Sales Analytics</h2>

<table class="table">
    <tr>
        <th>Item</th>
        <th>Total Quantity</th>
        <th>Total Income</th>
    </tr>

    {% for r in report %}
    <tr>
        <td>{{ r[0] }}</td>
        <td>{{ r[1] }}</td>
        <td>₹{{ r[2] }}</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
