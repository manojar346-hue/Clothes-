{% extends "base.html" %}
{% block content %}
<h2>Login</h2>

<form method="POST">
    <input type="text" name="username" placeholder="Enter Username" required>
    <input type="password" name="password" placeholder="Enter Password" required>
    <button>Login</button>
</form>

<p>Don't have an account? <a href="/register">Register</a></p>

{% endblock %}
