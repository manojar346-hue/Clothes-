{% extends "base.html" %}
{% block content %}

<div class="box">
    <h2>Login</h2>

    {% if msg %}
    <p style="color:red">{{ msg }}</p>
    {% endif %}

    <form method="POST">
        <input name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button>Login</button>
    </form>

    <p>Don't have account? <a href="/register">Register</a></p>
</div>

{% endblock %}
