{% extends "base.html" %}
{% block content %}

<div class="box">
    <h3>Login</h3>

    {% if error %}
        <p style="color:red">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <input name="username" placeholder="Username" required>
        <input name="password" type="password" placeholder="Password" required>
        <button>Login</button>
    </form>

    <a href="/register">Create account</a>
</div>

{% endblock %}
