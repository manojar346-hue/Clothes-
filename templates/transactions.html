<!DOCTYPE html>
<html>
<head><title>Transactions</title></head>
<body>
<h2>Inventory Transactions</h2>

<table border="1">
<tr>
    <th>Name</th><th>Size</th><th>Color</th><th>Quantity</th><th>Price</th><th>Timestamp</th>
</tr>

{% for t in data %}
<tr>
    <td>{{ t[1] }}</td>
    <td>{{ t[2] }}</td>
    <td>{{ t[3] }}</td>
    <td>{{ t[4] }}</td>
    <td>{{ t[5] }}</td>
    <td>{{ t[6] }}</td>
</tr>
{% endfor %}
</table>

</body>
</html>
