{% extends "base.html" %}
{% block content %}
<h3 style="text-align:center;">Transactions</h3>

<table>
    <tr>
        <th>Item</th>
        <th>Size</th>
        <th>Color</th>
        <th>Qty</th>
        <th>Price</th>
        <th>Time</th>
    </tr>

    {% for row in rows %}
    <tr>
        <td>{{ row[1] }}</td>
        <td>{{ row[2] }}</td>
        <td>{{ row[3] }}</td>
        <td>{{ row[4] }}</td>
        <td>{{ row[5] }}</td>
        <td>{{ row[6] }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
